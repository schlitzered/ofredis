apiVersion: kopf.dev/v1
kind: RedisReplication
metadata:
  name: rrk-blarg
  labels:
    somelabel: somevalue
  annotations:
    someannotation: somevalue
spec:
  acls:
    dummy1:
      passwords:
        - secretName: redis-replication-example
          secretDataKey: dummy1
      commands:
        - '+@all'
      keyPatterns:
        - '~*'
      pubsubPatterns:
        - '&*'
      userEnable: on
  config:
    appendfilename: dummy
    dbfilename: dummy
    masterauth: dummy
    masteruser: dummy
    protected-mode: dummy
    requirepass: dummy
    replica-announce-ip: dummy
    replica-announce-port: dummy
  replicas: 3
  redis:
    image: redis
