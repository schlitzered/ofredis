apiVersion: kopf.dev/v1
kind: RedisReplication
metadata:
  name: rrk-blarg
  labels:
    somelabel: somevalue
  annotations:
    someannotation: somevalue
spec:
  acls:
    dummy1:
      passwords:
        - secretName: redis-replication-example
          secretDataKey: dummy1
      commands:
        - '+@all'
      keyPatterns:
        - '~*'
      pubsubPatterns:
        - '&*'
      userEnable: on
  config:
    unknown: dummy
