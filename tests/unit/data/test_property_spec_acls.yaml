apiVersion: kopf.dev/v1
kind: RedisReplication
metadata:
  name: rrk-blarg
  labels:
    somelabel: somevalue
  annotations:
    someannotation: somevalue
spec:
  acls:
    dummy1:
      passwords:
        - secretName: redis-replication-example
          secretDataKey: dummy1
      commands:
        - '+@all'
      keyPatterns:
        - '~*'
      pubsubPatterns:
        - '&*'
      userEnable: on
    dummy2:
      passwords:
        - secretName: redis-replication-example
          secretDataKey: dummy2
      commands:
        - '-@all'
      userEnable: on
    dummy3:
      passwords:
        - secretName: redis-replication-example
          secretDataKey: dummy3
      commands:
        - 'get'
        - 'set'
      keyPatterns:
        - '~dummy3*'
      pubsubPatterns:
        - '&dummy3*'
      userEnable: on
    dummy4:
      passwords:
        - secretName: redis-replication-example
          secretDataKey: dummy4
      userEnable: off
    RedisOperator:
      passwords:
        - secretName: redis-replication-example
          secretDataKey: dummy1
      commands:
        - '+@all'
      keyPatterns:
        - '~*'
      pubsubPatterns:
        - '&*'
      userEnable: on
    RedisRepl:
      passwords:
        - secretName: redis-replication-example
          secretDataKey: dummy1
      commands:
        - '+@all'
      keyPatterns:
        - '~*'
      pubsubPatterns:
        - '&*'
      userEnable: on
  config:
    maxmemory: 128mb
    save: ''
  replicas: 3
  redis:
    image: redis
