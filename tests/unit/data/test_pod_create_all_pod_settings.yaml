apiVersion: kopf.dev/v1
kind: RedisReplication
metadata:
  name: rrk-blarg
  labels:
    somelabel: somevalue
  annotations:
    someannotation: somevalue
spec:
  acls:
    dummy1:
      passwords:
        - secretName: redis-replication-example
          secretDataKey: dummy1
      commands:
        - '+@all'
      keyPatterns:
        - '~*'
      pubsubPatterns:
        - '&*'
      userEnable: on
  config:
    maxmemory: 128mb
    save: ''
  replicas: 3
  redis:
    image: redis
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
#    securityContext:
#      runAsUser: 1000
#      runAsGroup: 3000
#      fsGroup: 2000

